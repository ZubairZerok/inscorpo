<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fluidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="35%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022c22" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#fluidBg)"/>
  <path d="M 0,0 Q 450,160 800,0 L 800,450 Z" fill="url(#glowTop)" opacity="0.6"/>

  <!-- 3D Center Solver & Goal Seek Badge -->
  <g transform="translate(400, 225) scale(1.15)" filter="url(#shadow3d)">
    <rect x="-85" y="-50" width="170" height="100" rx="16" fill="#0e7490" stroke="#A5F3FC" stroke-width="3"/>
    <rect x="-75" y="-40" width="150" height="32" rx="6" fill="#06B6D4"/>
    <text x="0" y="-18" text-anchor="middle" fill="#164E63" font-family="monospace" font-weight="900" font-size="16">SOLVER &amp; WHAT-IF</text>
    <text x="0" y="24" text-anchor="middle" fill="#CFFAFE" font-family="monospace" font-weight="900" font-size="20">VBA MACROS ⚡</text>
  </g>
</svg>
