<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="excelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#excelBg)"/>

  <!-- Brutalist Geometric Grid Pattern -->
  <g opacity="0.15" stroke="#A7F3D0" stroke-width="2">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>

    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Flat Vector Excel Grid Block -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="340" height="280" rx="12" fill="#022C22" stroke="#6EE7B7" stroke-width="4"/>
    
    <!-- Table Header Row -->
    <rect x="0" y="0" width="340" height="50" rx="12" fill="#10B981"/>
    <rect x="0" y="38" width="340" height="12" fill="#10B981"/>
    <text x="25" y="32" fill="#022C22" font-family="monospace" font-weight="900" font-size="18">EXCEL DATA ENGINE</text>

    <!-- Row Data Blocks -->
    <rect x="20" y="70" width="130" height="36" rx="6" fill="#065F46" stroke="#34D399" stroke-width="2"/>
    <rect x="165" y="70" width="155" height="36" rx="6" fill="url(#goldGrad)"/>
    <text x="180" y="94" fill="#78350F" font-family="monospace" font-weight="800" font-size="14">=XLOOKUP()</text>

    <rect x="20" y="120" width="130" height="36" rx="6" fill="#065F46" stroke="#34D399" stroke-width="2"/>
    <rect x="165" y="120" width="155" height="36" rx="6" fill="#6EE7B7"/>
    <text x="180" y="144" fill="#064E3B" font-family="monospace" font-weight="800" font-size="14">$1,450,000</text>

    <rect x="20" y="170" width="130" height="36" rx="6" fill="#065F46" stroke="#34D399" stroke-width="2"/>
    <rect x="165" y="170" width="155" height="36" rx="6" fill="#34D399"/>
    <text x="180" y="194" fill="#022C22" font-family="monospace" font-weight="800" font-size="14">INDEX + MATCH</text>

    <rect x="20" y="220" width="300" height="36" rx="6" fill="#10B981"/>
    <text x="35" y="244" fill="#022C22" font-family="sans-serif" font-weight="900" font-size="14">⚡ DYNAMIC ARRAY FORMULAS</text>
  </g>

  <!-- Vector Bar Chart Blocks -->
  <g transform="translate(450, 90)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="290" height="250" rx="12" fill="#064E3B" stroke="#A7F3D0" stroke-width="3"/>

    <rect x="35" y="150" width="40" height="80" rx="4" fill="#34D399"/>
    <rect x="95" y="110" width="40" height="120" rx="4" fill="#6EE7B7"/>
    <rect x="155" y="60" width="40" height="170" rx="4" fill="url(#goldGrad)"/>
    <rect x="215" y="30" width="40" height="200" rx="4" fill="#F43F5E"/>

    <!-- Trend Line -->
    <polyline points="55,140 115,100 175,50 235,20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="235" cy="20" r="7" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Decorative Brutalist Badge -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="260" height="42" rx="8" fill="#FBBF24" stroke="#78350F" stroke-width="3"/>
    <text x="20" y="27" fill="#78350F" font-family="sans-serif" font-weight="900" font-size="14">EXECUTIVE SPREADSHEETS</text>
  </g>
</svg>
