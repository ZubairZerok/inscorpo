<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Ultra Bright Vibrant Mesh Gradient -->
    <linearGradient id="fluidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="35%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <radialGradient id="glowTopRight" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowHard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#022c22" flood-opacity="0.7"/>
    </filter>

    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Bright Base Gradient Background -->
  <rect width="800" height="450" fill="url(#fluidBg)"/>
  <path d="M 0,0 Q 400,150 800,0 L 800,450 Z" fill="url(#glowTopRight)" opacity="0.8"/>

  <!-- Corner White Vector Floating Icons -->
  <!-- Top Left: Spreadsheet Table Icon -->
  <g transform="translate(110, 45)" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.95">
    <rect x="0" y="0" width="54" height="42" rx="6"/>
    <line x1="0" y1="14" x2="54" y2="14"/>
    <line x1="27" y1="14" x2="27" y2="42"/>
  </g>

  <!-- Top Right: Bar Chart Icon -->
  <g transform="translate(670, 140)" fill="#FFFFFF" opacity="0.95">
    <rect x="0" y="24" width="12" height="32" rx="2"/>
    <rect x="20" y="10" width="12" height="46" rx="2"/>
    <rect x="40" y="0" width="12" height="56" rx="2"/>
  </g>

  <!-- Bottom Left: Line Graph Trend Icon -->
  <g transform="translate(65, 330)" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.95">
    <polyline points="0,40 24,12 48,32 72,0" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="40" r="5" fill="#FFFFFF"/>
    <circle cx="24" cy="12" r="5" fill="#FFFFFF"/>
    <circle cx="48" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="72" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Right: Sigma Symbol -->
  <g transform="translate(680, 360)" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.95">
    <polyline points="40,0 0,0 22,24 0,48 40,48" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3D CENTER MICROSOFT EXCEL LOGO (HARD LOOK, NO OVERFLOW) -->
  <g transform="translate(400, 225) scale(1.15)" filter="url(#shadowHard)">
    <!-- Right Workbook Body -->
    <rect x="-35" y="-55" width="90" height="110" rx="14" fill="url(#excelGreen)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Horizontal Workbook Sheets Lines -->
    <rect x="-25" y="-35" width="70" height="18" rx="4" fill="#047857" opacity="0.5"/>
    <rect x="-25" y="-9" width="70" height="18" rx="4" fill="#047857" opacity="0.7"/>
    <rect x="-25" y="17" width="70" height="18" rx="4" fill="#047857" opacity="0.9"/>

    <!-- Overlapping Left Square with Bold "X" -->
    <rect x="-65" y="-35" width="70" height="70" rx="12" fill="#022c22" stroke="#6ee7b7" stroke-width="3"/>
    <text x="-30" y="15" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="44">X</text>
  </g>
</svg>
