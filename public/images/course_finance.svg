<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="goldFin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="emFin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#finBg)"/>

  <!-- Financial Grid Lines -->
  <g opacity="0.2" stroke="#93C5FD" stroke-width="2">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>

    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Valuation Sheet Vector Block -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="360" height="320" rx="16" fill="#172554" stroke="#60A5FA" stroke-width="4"/>

    <rect x="0" y="0" width="360" height="55" rx="16" fill="url(#goldFin)"/>
    <rect x="0" y="40" width="360" height="15" fill="#F59E0B"/>
    <text x="25" y="36" fill="#78350F" font-family="monospace" font-weight="900" font-size="18">DCF FINANCIAL MODEL</text>

    <!-- Cashflow Rows -->
    <rect x="25" y="75" width="140" height="40" rx="6" fill="#1E40AF"/>
    <text x="40" y="100" fill="#DBEAFE" font-family="monospace" font-weight="800" font-size="13">WACC Rate</text>
    <rect x="180" y="75" width="155" height="40" rx="6" fill="#2563EB"/>
    <text x="195" y="100" fill="#FFFFFF" font-family="monospace" font-weight="900" font-size="14">8.5% Cost Cap</text>

    <rect x="25" y="130" width="140" height="40" rx="6" fill="#1E40AF"/>
    <text x="40" y="155" fill="#DBEAFE" font-family="monospace" font-weight="800" font-size="13">FCFF Year 1-5</text>
    <rect x="180" y="130" width="155" height="40" rx="6" fill="url(#emFin)"/>
    <text x="195" y="155" fill="#FFFFFF" font-family="monospace" font-weight="900" font-size="14">$42.5M EBITDA</text>

    <rect x="25" y="185" width="140" height="40" rx="6" fill="#1E40AF"/>
    <text x="40" y="210" fill="#DBEAFE" font-family="monospace" font-weight="800" font-size="13">Implied Value</text>
    <rect x="180" y="185" width="155" height="40" rx="6" fill="url(#goldFin)"/>
    <text x="195" y="210" fill="#78350F" font-family="monospace" font-weight="900" font-size="14">$285M Enterprise</text>

    <rect x="25" y="245" width="310" height="50" rx="8" fill="#10B981"/>
    <text x="45" y="276" fill="#022C22" font-family="sans-serif" font-weight="900" font-size="15">📈 INVESTMENT BANKING READY</text>
  </g>

  <!-- Stock Growth Graph Vector -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="270" height="280" rx="16" fill="#1D4ED8" stroke="#93C5FD" stroke-width="4"/>

    <path d="M 30,220 Q 90,180 130,120 T 240,40" fill="none" stroke="#FBBF24" stroke-dasharray="0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 30,220 Q 90,180 130,120 T 240,40 L 240,240 L 30,240 Z" fill="#FBBF24" opacity="0.2"/>

    <circle cx="240" cy="40" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <text x="140" y="35" fill="#FEF08A" font-family="monospace" font-weight="900" font-size="16">+34.2% IRR</text>
  </g>
</svg>
